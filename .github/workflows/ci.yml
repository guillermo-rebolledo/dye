name: FilmEngine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - name: Test CI change detection
        run: python3 -B -m unittest discover -s Scripts -p 'test_ci_*.py'
      - name: Independent accuracy benchmark tests
        run: python3 -B -m unittest discover -s Scripts -p 'test_accuracy_*.py'
      - name: Fetch the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Select required checks
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 -B Scripts/ci_scope.py

  engine_tests:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift 6 typecheck and CLI build
        run: swift build
      # Spectral integration is CPU-bound. Keep renderer tests in Debug, but
      # use the optimized CLI for every bake and numerical validation.
      - name: Build optimized ProfileBaker
        run: |
          swift build -c release --product ProfileBaker
          echo "PROFILE_BAKER_EXECUTABLE=$(swift build -c release --show-bin-path)/ProfileBaker" >> "$GITHUB_ENV"
      # Swift Testing runs tests concurrently. Keep timing assertions away from
      # the other GPU renders and Baker processes without relaxing their budgets.
      - name: Preview performance budgets (isolated)
        run: swift test --filter previewRenderAndStockSwitchStayWithinInteractiveBudgets
      - name: Renderer, codec, and Baker CLI tests
        run: swift test --skip-build --skip previewRenderAndStockSwitchStayWithinInteractiveBudgets
      - name: Bake and verify the committed Catalogue
        run: |
          Scripts/bake-catalogue.sh
          git diff --exit-code -- Sources/FilmEngine/Catalogue
      - name: Numerical Step Wedges
        run: |
          mkdir -p .build/step-wedges
          baker="$PROFILE_BAKER_EXECUTABLE"
          for stock in Curves/*; do
            [ -f "$stock/stock.json" ] || continue
            id="$(basename "$stock")"
            "$baker" validate "$stock" "Sources/FilmEngine/Catalogue/$id.filmprofile" ".build/step-wedges/$id" 0.03
            case "$id" in
              portra-*|vision3-*|cinestill-*|provia-*|velvia-*)
                "$baker" validate-model "$stock" "Sources/FilmEngine/Catalogue/$id.filmprofile" ".build/step-wedges/$id-model.json" ;;
            esac
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: step-wedges
          path: |
            .build/step-wedges
            .build/golden-failures

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    env:
      # Liquid Glass requires the iOS 26 SDK even with runtime availability guards.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Verify app toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Dial mapping and rail selection
        run: python3 Scripts/check-dial-mapping.py
      - name: Build the iOS app (Baker is not linked)
        run: >-
          xcodebuild -project FilmApp.xcodeproj -scheme FilmApp
          -sdk iphonesimulator -configuration Debug
          -derivedDataPath .build/app CODE_SIGNING_ALLOWED=NO build

  # Preserve the existing required check, including for docs-only PRs. A failed
  # dependency must fail this check, not silently skip it and permit merging.
  engine:
    needs: [changes, engine_tests, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          CI_OK: >-
            ${{ needs.changes.result == 'success' &&
                ((needs.changes.outputs.engine == 'true' && needs.engine_tests.result == 'success') ||
                 (needs.changes.outputs.engine == 'false' && needs.engine_tests.result == 'skipped')) &&
                ((needs.changes.outputs.app == 'true' && needs.app.result == 'success') ||
                 (needs.changes.outputs.app == 'false' && needs.app.result == 'skipped')) }}
        run: test "$CI_OK" = true
